    <main>

            <h2>+2347084684799</h2>
            <h2>uyinosagbon22@gmail.com</h2>

        <section class="middle">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3963.41456858256!2d3.386550173504769!3d6.5952868223280445!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b92f1dbe0d0fb%3A0x5c7eb0a1c655d45!2s17%20Ogunshowobo%20St%2C%20Ketu%2C%20Lagos%20105102%2C%20Lagos!5e0!3m2!1sen!2sng!4v1785572555792!5m2!1sen!2sng"

            <form>
                <div class="label">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Joshua">
                </div>

                <div class="label">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email"
                      placeholder="uyinosagbon22@gmail.com">
                </div>

                <div class="label" id="plenty">
                    <div class="wrap"><label>Message Purpose</label></div>
                    <input type="radio" id="inquiry" name="purpose" value="inquiry">
                    <label for="inquiry">General Inquiry</label>
                    <input type="radio" name="purpose" id="reservation" value="reservation">
                    <label for="reservation">Reservation Request</label>
                    <input type="radio" name="purpose" id="suggestion" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </div>

                <div class="label-3">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>

                <div class="label">
                    <input type="checkbox" name="ask" id="ask">
                    <label for="ask">Please Subscribe to the monthly newsletter</label>
                </div>

                <div class="label"><button type="submit">Get in Touch!</button></div>

            </form>
        </section>

        <section class="end">
            <h2>We are Here to serve you</h2>
            <figure>
                <img src="images/elijah-director.webp" alt="elijah - the director">
                <figcaption>Elijah - The Director</figcaption>
