<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>✅Basic Html Quiz</h1>
    </header>

    <main>
        <form>
            <label for="q1"><span>1.</span> What does the acronym CSS stand for</label>
            <input type="text" id="q1" name="q1">
            <label for="q2"><span>2.</span> How are id and class attributes selected in CSS</label>
            <textarea name="q2" id="q2"></textarea>
            <label for="q3"><span>3.</span> Which of the following is a valid CSS comment?</label>
            <select name="q3" id="q3">
                <option value="1" selected disabled>Choose one</option>
                <option value="2">#this is a comment</option>
                <option value="3">/*this is a comment*/</option>
                <option value="4">&lt;!-- this is a comment --&gt;</option>
            </select>
            <label for="q4"><span>4.</span> What is the bottom given in this declaration</label>
            <p>margin: 10px 5px 15px;</p>
            <input type="text" name="q4" id="q4">
            <button>Submit Quiz</button>
        </form>
    </main>

    <footer>
        <p>Example Quiz</p>
        <p>This is just an example. Style your own form using your iwn design content</p>
    </footer>

</body>

</html>
